name: Feature request
description: Suggest an improvement to IBU.Tools.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: This suggestion is public. Do not include confidential models, project names or paths, credentials, customer data, or unreviewed logs.
  - type: input
    id: workflow
    attributes:
      label: Affected tool or task
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Describe the need without confidential project information.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Desired outcome
      description: Describe the result you need; implementation details are not required.
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Privacy confirmation
      options:
        - label: I removed confidential models, names, paths, credentials, customer information, and unreviewed logs.
          required: true
