name: Bug report
description: Report a reproducible IBU.Tools problem using sanitized information.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        This report is public. Do not attach confidential models, project names or paths, credentials, customer data, or unreviewed logs. Reproduce with non-confidential sample data. For direct contact: ibulearning@gmail.com.
  - type: input
    id: ibu-version
    attributes:
      label: IBU.Tools version
      placeholder: 0.9.0 Preview
    validations:
      required: true
  - type: input
    id: revit-version
    attributes:
      label: Exact Revit version and update/build
      description: Copy the version information from Revit's About window.
    validations:
      required: true
  - type: input
    id: module
    attributes:
      label: Affected module
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Keep steps brief and use sanitised sample information.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Privacy confirmation
      options:
        - label: I removed confidential models, names, paths, credentials, customer information, and unreviewed logs.
          required: true
